app = "honkers-indexer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  INDEXER_PORT = "3001"
  AZTEC_RPC_URL = "https://rpc.testnet.aztec-labs.com"
  POLL_INTERVAL_MS = "30000"

[[mounts]]
  source = "honkers_indexer_data"
  destination = "/app/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
