services:
  # ── Keeper bot ──────────────────────────────────────────────────────────────
  keeper:
    build:
      context: ./keeper
      dockerfile: Dockerfile
    container_name: honkers-keeper
    environment:
      AZTEC_RPC_URL: https://rpc.testnet.aztec-labs.com
      KEEPER_POLL_INTERVAL_MS: "600000"
      KEEPER_HEALTH_INTERVAL_MS: "60000"
      ORACLE_ADDRESS: ${ORACLE_ADDRESS:-}
      MARKET_FACTORY_ADDRESS: ${MARKET_FACTORY_ADDRESS:-}
      AMM_ADDRESS: ${AMM_ADDRESS:-}
      ADMIN_PRIVATE_KEY: ${ADMIN_PRIVATE_KEY:-}
      KEEPER_AUTO_VOID_MODE: ${KEEPER_AUTO_VOID_MODE:-alert_only}
    restart: unless-stopped

  # ── Frontend (Vite dev server) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: honkers-frontend
    ports:
      - "5173:5173"
    environment:
      AZTEC_SANDBOX_URL: https://rpc.testnet.aztec-labs.com
      # Contract addresses — sourced from .env at repo root
      VITE_MARKET_FACTORY_ADDRESS: ${MARKET_FACTORY_ADDRESS:-}
      VITE_AMM_ADDRESS: ${AMM_ADDRESS:-}
      VITE_ORACLE_ADDRESS: ${ORACLE_ADDRESS:-}
      VITE_TEST_TOKEN_ADDRESS: ${TEST_TOKEN_ADDRESS:-}
      VITE_PRIVATE_VAULT_ADDRESS: ${PRIVATE_VAULT_ADDRESS:-}
      # Admin + fee config
      VITE_ADMIN_ADDRESSES: ${VITE_ADMIN_ADDRESSES:-${ADMIN_ADDRESS:-}}
      VITE_SPONSORED_FPC_ADDRESS: ${SPONSORED_FPC_ADDRESS:-}
      VITE_FEE_RECIPIENT_ADDRESS: ${ADMIN_ADDRESS:-}
    restart: unless-stopped
