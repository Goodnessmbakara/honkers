services:
  # ── Anvil (L1 Ethereum devnet) ─────────────────────────────────────────────
  ethereum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: honkers-ethereum
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ── Aztec Local Network (PXE + L2 Node + Sequencer) ────────────────────────
  sandbox:
    image: aztecprotocol/aztec:4.1.3
    container_name: honkers-sandbox
    ports:
      - "8080:8080"
    environment:
      ETHEREUM_HOSTS: http://ethereum:8545
      L1_CHAIN_ID: "31337"
      AZTEC_PORT: "8080"
      LOG_LEVEL: info
    command: ["start", "--local-network", "--port", "8080"]
    depends_on:
      ethereum:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: honkers-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: honkers
      POSTGRES_PASSWORD: honkers
      POSTGRES_DB: honkers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honkers"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Indexer (REST API + block poller) ───────────────────────────────────────
  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: honkers-indexer
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://honkers:honkers@postgres:5432/honkers
      AZTEC_RPC_URL: http://sandbox:8080
      INDEXER_PORT: "3001"
      POLL_INTERVAL_MS: "5000"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # ── Keeper bot ──────────────────────────────────────────────────────────────
  keeper:
    build:
      context: ./keeper
      dockerfile: Dockerfile
    container_name: honkers-keeper
    environment:
      DATABASE_URL: postgresql://honkers:honkers@postgres:5432/honkers
      AZTEC_RPC_URL: http://sandbox:8080
      KEEPER_POLL_INTERVAL_MS: "300000"
      KEEPER_HEALTH_INTERVAL_MS: "60000"
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite dev server) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: honkers-frontend
    ports:
      - "5173:5173"
    environment:
      AZTEC_SANDBOX_URL: http://sandbox:8080
      VITE_INDEXER_API_URL: http://localhost:3001
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
